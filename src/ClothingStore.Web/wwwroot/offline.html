<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14151B" />
    <title>Sem conexão — YouLink</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #14151B;
            --card: #1C1E26;
            --border: rgba(212, 175, 106, 0.28);
            --text: #FAF8F5;
            --muted: #B6B2A8;
            --accent: #D4AF6A;
            --accent-text: #14151B;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top, #1F222C 0%, var(--bg) 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .offline-card {
            width: min(100%, 420px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .offline-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 1rem;
            border-radius: 16px;
            display: block;
        }
        h1 {
            margin: 0 0 0.65rem;
            font-size: 1.35rem;
        }
        p {
            margin: 0 0 1.35rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .offline-btn {
            display: inline-block;
            padding: 0.78rem 1.35rem;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <img src="/icons/icon-192.png" alt="YouLink" class="offline-icon" />
        <h1>Você está sem internet</h1>
        <p>Não foi possível carregar o catálogo agora. Reconecte seu Wi-Fi ou dados móveis e toque abaixo para atualizar a loja.</p>
        <a href="/" class="offline-btn">Tentar novamente</a>
    </main>
</body>
</html>
