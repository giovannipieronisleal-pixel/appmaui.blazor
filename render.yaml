services:
  - type: web
    name: youlink-loja
    runtime: docker
    dockerfilePath: ./src/ClothingStore.Web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: YOULINK_SYNC_SECRET
        generateValue: true
      - key: YOULINK_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
